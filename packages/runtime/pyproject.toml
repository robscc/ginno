[project]
name = "ginno-runtime"
version = "0.2.0"
description = "Ginno personal agent runtime — LangGraph + FastAPI sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # langchain 系精确锁版（2026-10-31 评估定稿）：runtime 对 langgraph 的
    # checkpoint 协议行为（parent-id-in-config、pending-writes 语义、mid-step
    # resume）有深度耦合，见 checkpointer.py 的版本对冲注释——浮动下限
    # （>=0.2）会在 lock 刷新时悄悄跳大版本，行为漂移只能靠现场排查。
    # 升级 = 显式改这里 + 全量测试。
    "langgraph==1.2.19",
    "langchain-core==1.7.3",
    "langchain-anthropic==1.7.7",
    "langchain-openai==1.7.3",
    "mcp>=1.0",
    "orjson>=3.10",
    "pydantic>=2.7",
    # 14+：wecom WS 握手用 additional_headers 带统一 UA（12/13 是 extra_headers）
    "websockets>=14",
    "anyio>=4",
    "tomli; python_version < '3.11'",
    "typer>=0.27.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3", "langchain-ollama>=0.1"]
rag = ["lancedb>=0.10", "sentence-transformers>=3"]
dev = ["ruff>=0.5", "pyinstaller>=6"]
docs = [
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pypdf>=4",
    "python-calamine>=0.2",
    "python-docx>=1.1",
    "python-pptx>=0.6",
]

[project.scripts]
ginno-runtime = "ginno_runtime.server:main"
ginno = "ginno_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ginno_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Correctness-only gate (issue #22): rules that catch real bugs. Formatting /
# style (E5xx, I, B9xx, UP) is deliberately not enforced — the codebase predates
# a style gate and adoption would be pure churn. Explicit rule list, no
# umbrella selectors, so a ruff version bump cannot silently add new checks.
#   F401/F402/F403/F404/F405 unused/ambiguous imports — excluded: the codebase
#   uses namespace re-export blocks (`# noqa: F401`) heavily; noise, not bugs.
#   F841 unused local — excluded: noise.
select = [
    "F501", # percent-format-invalid-format
    "F502", # percent-format-expected-mapping
    "F503", # percent-format-expected-sequence
    "F504", # percent-format-extra-named-arguments
    "F505", # percent-format-missing-argument
    "F601", # multi-value-repeated-key-literal
    "F632", # string-literal-comparison (str/bytes `is` comparison)
    "F633", # invalid-print-syntax
    "F702", # continue-outside-loop
    "F706", # return-outside-function
    "F811", # redefinition-of-unused-name
    "F821", # undefined-name
    "F823", # local-variable-referenced-before-assignment
    "E711", # comparison-with-none
    "E712", # comparison-with-true-false
    "E713", # not-in-test (`not x in y`)
    "E714", # not-is-test (`not x is y`)
    "E721", # type-comparison (== instead of is)
    "E722", # bare-except
]

[tool.ruff.lint.per-file-ignores]
# browser/executor.py: %-formatting deliberately builds JS literals for
# Runtime.evaluate (repr/quoting) — f-string conversion would break quoting.
"src/ginno_runtime/browser/executor.py" = ["UP031"]
# scripts.py embeds JS strings; long lines are readable as-is.
"src/ginno_runtime/browser/scripts.py" = ["E501"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    # DingTalk channel connector (docs/dingtalk-connector-design.md): Stream
    # 模式 WebSocket 接入（事件推送 + 机器人消息 + 卡片回调）。
    "dingtalk-stream>=0.20",
    "playwright>=1.45",
    # correctness lint gate (issue #22) — CI `ruff check` runs in this env
    "ruff>=0.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no FastAPI, no graph)",
    "api: HTTP API integration tests (FastAPI TestClient)",
    "e2e: full LangGraph + WebSocket end-to-end tests",
]
# Starlette's TestClient prints an httpx deprecation notice; keep it a non-fatal warning.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
