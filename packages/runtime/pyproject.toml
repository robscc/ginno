[project]
name = "ginno-runtime"
version = "0.1.0"
description = "Ginno personal agent runtime — LangGraph + FastAPI sidecar"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "langgraph>=0.2.50",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",
    "mcp>=1.0",
    "pydantic>=2.7",
    "websockets>=12",
    "anyio>=4",
    "tomli; python_version < '3.11'",
    "typer>=0.27.0",
]

[project.optional-dependencies]
local = ["ollama>=0.3", "langchain-ollama>=0.1"]
rag = ["lancedb>=0.10", "sentence-transformers>=3"]
dev = ["ruff>=0.5", "pyinstaller>=6"]

[project.scripts]
ginno-runtime = "ginno_runtime.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ginno_runtime"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: pure unit tests (no FastAPI, no graph)",
    "api: HTTP API integration tests (FastAPI TestClient)",
    "e2e: full LangGraph + WebSocket end-to-end tests",
]
# Starlette's TestClient prints an httpx deprecation notice; keep it a non-fatal warning.
filterwarnings = [
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
