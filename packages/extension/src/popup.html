<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root { color-scheme: light dark; }
  body {
    width: 300px; margin: 0; padding: 14px;
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  h1 { font-size: 14px; margin: 0 0 10px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #999; flex: none; }
  .dot.ok { background: #22c55e; } .dot.err { background: #ef4444; }
  .row { margin: 10px 0; }
  label { display: block; color: inherit; opacity: .75; font-size: 12px; margin-bottom: 4px; }
  input[type=number] {
    width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 8px;
    border: 1px solid rgba(128,128,128,.4); background: transparent; color: inherit;
  }
  button {
    width: 100%; padding: 8px; border: 0; border-radius: 8px; cursor: pointer;
    background: #7c5cfa; color: #fff; font-weight: 600; margin-top: 6px;
  }
  button:hover { background: #6d4ee6; }
  .meta { opacity: .7; font-size: 12px; margin-top: 10px; word-break: break-all; }
  .help { font-size: 12px; opacity: .75; margin-top: 10px; }
  a { color: #7c5cfa; }
</style>
</head>
<body>
  <h1><span id="dot" class="dot"></span> <span data-i18n="ext_popup_title">Ginno Browser Connector</span></h1>
  <div class="row">
    <div id="status" data-i18n="ext_popup_checking">Checking connection…</div>
  </div>
  <div class="row">
    <label for="port" data-i18n="ext_popup_portLabel">Ginno port (usually no need to change; leave empty for auto-discovery)</label>
    <input id="port" type="number" min="1024" max="65535" placeholder="8787" />
    <button id="save" data-i18n="ext_popup_save">Save and reconnect</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="row">
    <button id="send" style="background:#111827" data-i18n="ext_popup_sendPage">Send this page to Ginno</button>
    <div id="sendMsg" class="help" style="margin-top:4px;display:none"></div>
  </div>
  <div class="help"><span data-i18n="ext_popup_helpA">Not connected? Make sure the Ginno desktop app is running, and see the install guide on Ginno's </span><b data-i18n="ext_popup_connectors">Connectors</b><span data-i18n="ext_popup_helpB"> page.</span></div>
<script src="popup.js"></script>
</body>
</html>
