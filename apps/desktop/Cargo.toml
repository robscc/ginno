[package]
name = "ginno-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Ginno personal agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ginno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# preview-macos-un: modern UNUserNotificationCenter backend. The default
# NSUserNotification path is deprecated and, on current macOS, only ever
# shows the generic first-use banner for background apps — the notification
# content (and its click) never reaches the user.
notify-rust = { version = "4", features = ["preview-macos-un"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
