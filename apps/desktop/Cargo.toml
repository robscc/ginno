[package]
name = "ginno-desktop"
version = "0.1.0"
description = "Tauri desktop shell for Ginno personal agent"
edition = "2021"
rust-version = "1.77"

[lib]
name = "ginno_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: menu-bar entry for the floating quick-chat window (悬浮速聊窗);
# macos-private-api: transparent undecorated pin window (rounded corners).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# NSWindowCollectionBehavior tweaks for the pin window (fullscreen-space
# policy: "avoid" = default macOS behavior, "overlay" = FullScreenAuxiliary).
[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# preview-macos-un: modern UNUserNotificationCenter backend. The default
# NSUserNotification path is deprecated and, on current macOS, only ever
# shows the generic first-use banner for background apps — the notification
# content (and its click) never reaches the user.
notify-rust = { version = "4", features = ["preview-macos-un"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
