name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (test group + docs extras)
        # docs extras (openpyxl/pandas/python-docx/pptx/pypdf/calamine) are
        # needed by the extractors / preview / document-tools suites — the
        # local .venv carries them, a bare --group test env does not.
        run: uv sync --group test --extra docs

      # The suite is hermetic: no network, no API key, no MCP servers spawn
      # (empty mcp.json), so no extra services are required.
      - name: Run tests (with coverage)
        run: uv run --group test --extra docs pytest -q --cov=ginno_runtime --cov-report=term --cov-report=xml

      # Correctness-only lint gate (issue #22): ruff with an explicit rule
      # list in pyproject.toml [tool.ruff.lint] — no style/format rules.
      - name: Ruff (correctness rules)
        run: uv run --group test --extra docs ruff check .

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: packages/runtime/coverage.xml
          flags: runtime
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos; tokenless if unset
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Typecheck (includes *.test.ts)
        working-directory: apps/web
        run: pnpm typecheck

      - name: Unit tests (vitest, with coverage)
        working-directory: apps/web
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/cobertura-coverage.xml
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos; tokenless if unset
          fail_ci_if_error: false


      - name: Build (Next.js static export)
        working-directory: apps/web
        run: pnpm build

  rust:
    # macOS runner: the desktop crate pulls Tauri, whose Linux build needs
    # webkit2gtk/gtk system packages — not worth installing per-run while a
    # public repo gets macOS minutes free. mod-broker rides along.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            crates/mod-broker

      - name: rustfmt
        run: |
          cargo fmt --manifest-path crates/mod-broker/Cargo.toml --all --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml --all --check

      # tauri-build validates bundle.resources at build-script time; the real
      # PyInstaller bundle / mod-runner are materialized by `make app` locally,
      # which a bare checkout doesn't run. Placeholders only need to exist.
      - name: Materialize Tauri bundle resource placeholders
        run: |
          mkdir -p apps/desktop/resources/runtime
          printf 'placeholder — real bundle is materialized by make app\n' > apps/desktop/resources/runtime/.placeholder
          printf '// placeholder — real bundle is materialized by make app\n' > apps/desktop/resources/mod-runner.mjs

      - name: cargo check (mod-broker)
        run: cargo check --manifest-path crates/mod-broker/Cargo.toml

      # Fast lib-only test pass (issue #22) — no `cargo test` on the desktop
      # shell: it needs the materialized Tauri bundle resources and would
      # duplicate the check above.
      - name: cargo test --lib (mod-broker)
        run: cargo test --lib --manifest-path crates/mod-broker/Cargo.toml

      - name: cargo check (desktop shell)
        run: cargo check --manifest-path apps/desktop/Cargo.toml

  mod-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/mod-runner
        run: pnpm typecheck

      - name: Unit tests (vitest)
        working-directory: packages/mod-runner
        run: pnpm test

  # ── UI e2e 闸门（2026-11-12 用户需求：合并前走全量 e2e，@ 提示等前端
  # 交互必须覆盖）────────────────────────────────────────────────────────
  # packaged UI 套件（tests/e2e/test_packaged_ui_*.py）需要 dist sidecar +
  # 真实 Chromium——ubuntu 的 runtime-tests 无 bundle 恒 skip，此前 CI 从未
  # 真正跑过浏览器级用例。本 job 在 macos 上构建 runtime bundle（make runtime
  # 含 web build + PyInstaller）后跑全套 packaged UI e2e。
  ui-e2e:
    runs-on: macos-14
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: |
          uv sync --group test --extra docs
          pnpm install --frozen-lockfile

      - name: Build runtime bundle (web + PyInstaller)
        run: make runtime
        working-directory: .

      - name: Install Chromium (playwright)
        run: uv run --group test python -m playwright install chromium

      - name: Run packaged UI e2e
        run: uv run --group test --extra docs pytest tests/e2e/test_packaged_ui_mention.py tests/e2e/test_packaged_ui_playwright.py tests/e2e/test_packaged_ui_ask_user.py tests/e2e/test_playwright_mcp_trending.py -q
