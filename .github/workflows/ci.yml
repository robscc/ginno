name: CI

on:
  push:
    branches: [main]
  pull_request:
  # ui-e2e job 的门控是 `if: github.event_name == 'workflow_dispatch'`，但本块
  # 原先只有 push/pull_request —— 该 job 自 2026-11-12 改手动触发那天起就
  # **结构上永不可达**（gh workflow run 报 HTTP 422: Workflow does not have
  # 'workflow_dispatch' trigger；近 30 次 CI 运行零 dispatch 事件）。
  # 补上触发器，Actions 页的 Run workflow 按钮才会出现。
  workflow_dispatch:
  # rust job 的周维护触发（2026-11-18 起非自动：macOS 分钟配额耗尽，见该
  # job 的 if 注释）。周一 02:00 UTC 慢机档跑一轮 fmt+check 防长期漂移。
  schedule:
    - cron: "0 2 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v4

      - name: Check desktop tray animation frames
        run: bash apps/desktop/scripts/check_tray_frames.sh
        working-directory: ${{ github.workspace }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (test group + docs extras)
        # docs extras (openpyxl/pandas/python-docx/pptx/pypdf/calamine) are
        # needed by the extractors / preview / document-tools suites — the
        # local .venv carries them, a bare --group test env does not.
        run: uv sync --group test --extra docs

      # The suite is hermetic: no network, no API key, no MCP servers spawn
      # (empty mcp.json), so no extra services are required.
      - name: Run tests (with coverage)
        run: uv run --group test --extra docs pytest -q -n auto --dist loadgroup --cov=ginno_runtime --cov-report=term --cov-report=xml

      # Correctness-only lint gate (issue #22): ruff with an explicit rule
      # list in pyproject.toml [tool.ruff.lint] — no style/format rules.
      - name: Ruff (correctness rules)
        run: uv run --group test --extra docs ruff check .

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: packages/runtime/coverage.xml
          flags: runtime
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos; tokenless if unset
          fail_ci_if_error: false

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Typecheck (includes *.test.ts)
        working-directory: apps/web
        run: pnpm typecheck

      - name: Unit tests (vitest, with coverage)
        working-directory: apps/web
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          files: apps/web/coverage/cobertura-coverage.xml
          flags: web
          token: ${{ secrets.CODECOV_TOKEN }}   # optional for public repos; tokenless if unset
          fail_ci_if_error: false


      - name: Build (Next.js static export)
        working-directory: apps/web
        run: pnpm build

  rust:
    # macOS runner: the desktop crate pulls Tauri, whose Linux build needs
    # webkit2gtk/gtk system packages — not worth installing per-run while a
    # public repo gets macOS minutes free. mod-broker rides along.
    #
    # ⚠️ 2026-11-18 暂改非自动触发（同 ui-e2e 模式）：当天 PR #210 的 rust job
    # 三连 cancelled（无编译日志、无 timeout 配置、同时段 main 同 job 1m23s
    # success、PR 未动 Rust 文件）——最自洽归因为 GitHub Free macOS 分钟配额
    # 耗尽（2000min/月 ÷ 10 倍率 = 200 实际分钟；当日 6 PR × rust 9-15min +
    # 并行分支叠加烧穿；11-15 ui-e2e 的 cancelled 是 macos-14 退役、本次排除
    # ——macos-15 当天 14:01 仍 success）。配额恢复或迁移 Linux（apt 装
    # webkit2gtk，需先验证 desktop crate 的 #[cfg(target_os)] 覆盖面）后，
    # 删除下行 if 恢复自动触发。
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.repository == 'robscc/ginno')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            apps/desktop
            crates/mod-broker

      - name: rustfmt
        run: |
          cargo fmt --manifest-path crates/mod-broker/Cargo.toml --all --check
          cargo fmt --manifest-path apps/desktop/Cargo.toml --all --check

      # tauri-build validates bundle.resources at build-script time; the real
      # PyInstaller bundle / mod-runner are materialized by `make app` locally,
      # which a bare checkout doesn't run. Placeholders only need to exist.
      - name: Materialize Tauri bundle resource placeholders
        run: |
          mkdir -p apps/desktop/resources/runtime
          printf 'placeholder — real bundle is materialized by make app\n' > apps/desktop/resources/runtime/.placeholder
          printf '// placeholder — real bundle is materialized by make app\n' > apps/desktop/resources/mod-runner.mjs

      - name: cargo check (mod-broker)
        run: cargo check --manifest-path crates/mod-broker/Cargo.toml

      # Fast lib-only test pass (issue #22) — no `cargo test` on the desktop
      # shell: it needs the materialized Tauri bundle resources and would
      # duplicate the check above.
      - name: cargo test --lib (mod-broker)
        run: cargo test --lib --manifest-path crates/mod-broker/Cargo.toml

      - name: cargo check (desktop shell)
        run: cargo check --manifest-path apps/desktop/Cargo.toml

  mod-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/mod-runner
        run: pnpm typecheck

      - name: Unit tests (vitest)
        working-directory: packages/mod-runner
        run: pnpm test

  # ── UI e2e 闸门（2026-11-12 用户需求：合并前走全量 e2e，@ 提示等前端
  # 交互必须覆盖）────────────────────────────────────────────────────────
  # packaged UI 套件（tests/e2e/test_packaged_ui_*.py）需要 dist sidecar +
  # 真实 Chromium——ubuntu 的 runtime-tests 无 bundle 恒 skip，此前 CI 从未
  # 真正跑过浏览器级用例。本 job 在 macos 上构建 runtime bundle（make runtime
  # 含 web build + PyInstaller）后跑全套 packaged UI e2e。
  ui-e2e:
    # ⚠️ 2026-11-12 暂改手动触发：当时 PR 触发实测 macOS runner 连续 cancelled
    # （job 未启动无日志），当时归因为「macOS 分钟池耗尽，rust job ×15 轮叠加」。
    # **2026-11-15 更正**：至少 2026-11-15 那次 cancelled 不是额度问题——
    # 真因是 macos-14 runner 已退役（见下方 runs-on 注释），同 run 的 rust job
    # 在 macos-15 上正常 success。2026-11-12 当时是否叠加额度因素无法回溯，
    # 标为待核实。恢复自动触发前应先手动 dispatch 观察一轮。
    # 大发版/关键前端 PR 前手动跑一次（Actions 页 → CI → Run workflow）。
    if: github.event_name == 'workflow_dispatch'
    # macos-14 已于 2026-11-02 从 GitHub Actions 退役（arm64 无延期，官方
    # runner-images README：「All macOS 14 images retired ... This extension
    # does not apply to Arm64 images」）。c2e5e18 把 rust job 迁到 macos-15
    # 时漏了本 job，导致 2026-11-15 首次真 dispatch（run 43699273371）里
    # ui-e2e **1 秒 cancelled、steps 为空、runner_name 为空**，注解
    # 「The configuration 'macos-14-arm64-us-default' is not supported」。
    # 同 run 的 rust job 在 macos-15 上 51 秒 success，证明不是额度问题。
    runs-on: macos-15
    defaults:
      run:
        working-directory: packages/runtime
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install deps
        run: |
          uv sync --group test --extra docs
          pnpm install --frozen-lockfile

      - name: Build runtime bundle (web + PyInstaller)
        run: make runtime
        working-directory: .

      - name: Install Chromium (playwright)
        run: uv run --group test python -m playwright install chromium

      - name: Run packaged UI e2e
        # 用 glob 而非硬编码文件清单：原清单只列 4 个文件，而仓库已有 12 个
        # test_packaged_ui_*.py —— team/a2a/notify/context_panel/idle_perf/
        # instincts/model_effort/plan_dag/web_search_fix 共 8 个被漏，新增用例
        # 永远进不了闸门（正是 CLAUDE.md 立规要防的「闸门覆盖不到新用例」）。
        # test_playwright_mcp_trending.py 不匹配该前缀，单独列出。
        run: uv run --group test --extra docs pytest tests/e2e/test_packaged_ui_*.py tests/e2e/test_playwright_mcp_trending.py -q

  # ── UI e2e 精准冒烟（按路径触发，2026-11-21）──────────────────────────
  # tasks-overview 相关 PR 在 Linux 上以「源码 sidecar + 静态导出」跑
  # test_packaged_ui_tasks_overview.py 两条冒烟（无 PyInstaller、零 macOS
  # 分钟）；全套 packaged UI e2e 仍保留在上方手动 ui-e2e job。
  # 防假绿双闸：GINNO_E2E_STRICT=1 把「环境不满足→skip」升级为 fail；
  # junit 断言 2 用例全 passed（skipped/failed 都算红）。
  ui-e2e-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect product UX and tasks-overview changes (path filter)
        id: filter
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED="$(git diff --name-only "$BASE_SHA...HEAD")"
          echo "$CHANGED"
          if grep -Eq '(^packages/runtime/tests/e2e/test_packaged_ui_(tasks_overview|product_ux|ask_user|settings_schedule)\.py$)|(^apps/web/src/components/(ConfirmModal|settings/(EnvVarsSettings|SettingsCorruptBanner|SettingsView|WorkflowsSettings))\.tsx$)|(^apps/web/src/components/scheduled/)|(^apps/web/src/lib/(workflows/|envVarsRows\.ts$|api/(workspace|workflows|settings)\.ts$))|(^apps/web/messages/(en|zh-CN)/(sched|tools)\.json$)|(^packages/runtime/src/ginno_runtime/(api/(workflows|settings|env_settings)\.py$|workflows/|settings_store\.py$|settings_gate\.py$|env_store\.py$|scheduler\.py$|schedule_store\.py$|startup_tasks\.py$|paths\.py$))|(^packages/runtime/tests/e2e/_sidecar\.py$)|(^apps/web/src/components/(right/(TasksOverviewPanel|RightPanel)|shell/SidebarHeader)\.tsx$)|(^apps/web/src/lib/tasks(Overview|Counts)\.ts$)|(^apps/web/src/lib/api/tasks(Overview|Counts)\.ts$)|(^apps/web/messages/(en|zh-CN)/right\.json$)|(^packages/runtime/src/ginno_runtime/api/(tasks_overview|tasks_counts|plans|schedule)\.py$)|(^packages/runtime/src/ginno_runtime/plans/)|(^\.github/workflows/ci\.yml$)' <<< "$CHANGED"; then
            echo "smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "smoke=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Not applicable (no tasks-overview changes)
        if: steps.filter.outputs.smoke != 'true'
        run: echo "PR does not touch tasks-overview surfaces — smoke skipped by path filter"

      - name: Install uv
        if: steps.filter.outputs.smoke == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.filter.outputs.smoke == 'true'
        run: uv python install 3.12

      - name: Install pnpm
        if: steps.filter.outputs.smoke == 'true'
        uses: pnpm/action-setup@v4

      - name: Set up Node
        if: steps.filter.outputs.smoke == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install runtime test deps
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        run: uv sync --group test --extra docs

      - name: Install workspace dependencies
        if: steps.filter.outputs.smoke == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build web static export (source sidecar serves apps/web/out)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: apps/web
        run: pnpm build

      - name: Install Chromium (playwright)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        run: uv run --group test python -m playwright install --with-deps chromium

      - name: Run tasks-overview UI smoke (source sidecar, isolated port)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        env:
          GINNO_E2E_RUNTIME: source
          GINNO_E2E_STRICT: "1"
        run: uv run --group test --extra docs pytest tests/e2e/test_packaged_ui_tasks_overview.py -q --junitxml=smoke-junit.xml

      - name: Run product UX regression (separate suite; keep smoke count at two)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        env:
          GINNO_E2E_RUNTIME: source
          GINNO_E2E_STRICT: "1"
        run: uv run --group test --extra docs pytest tests/e2e/test_packaged_ui_product_ux.py -q

      # settings 完整性 × 调度可靠性回归（settings-schedule-integrity）：损坏
      # 拒写/掩码/双窗口 CAS/once 生命周期/丢回执对账。含真实调度等待的用例，
      # timeout 放宽到 12 分钟。
      - name: Run settings/schedule integrity regression (source sidecar)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        env:
          GINNO_E2E_RUNTIME: source
          GINNO_E2E_STRICT: "1"
        run: uv run --group test --extra docs pytest tests/e2e/test_packaged_ui_settings_schedule.py -q --timeout=720

      - name: Assert smoke actually ran (skip = fail, anti fake-green)
        if: steps.filter.outputs.smoke == 'true'
        working-directory: packages/runtime
        run: |
          uv run --group test python - <<'PY'
          import xml.etree.ElementTree as ET
          s = ET.parse("smoke-junit.xml").getroot()
          s = s.find("testsuite") if s.tag == "testsuites" else s
          t = int(s.get("tests", "0")); f = int(s.get("failures", "0"))
          e = int(s.get("errors", "0")); k = int(s.get("skipped", "0"))
          print(f"tests={t} failures={f} errors={e} skipped={k}")
          assert t == 2 and f == 0 and e == 0 and k == 0, "smoke gate: both tests must pass; skipping is a failure"
          PY
